apiVersion: v1
kind: ConfigMap
metadata:
  name: order-fulfillment-config
  namespace: order-fulfillment
  labels:
    app.kubernetes.io/name: order-fulfillment
data:
  StorageAccountName: "stofdev"
  KeyVaultUri: "https://kv-ofdev.vault.azure.net/"
  LOGGING__LOGLEVEL__DEFAULT: "Information"
  LOGGING__APPLICATIONINSIGHTS__LOGLEVEL__DEFAULT: "Information"
  LOGGING__APPLICATIONINSIGHTS__LOGLEVEL__AZURE: "Warning"
  LOGGING__APPLICATIONINSIGHTS__LOGLEVEL__MICROSOFT: "Warning"
