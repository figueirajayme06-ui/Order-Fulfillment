apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: order-fulfillment-secrets-provider
  namespace: order-fulfillment
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "e143c84f-195f-407f-a2ee-981ec2eeecc6"
    keyvaultName: kv-ofsit
    tenantId: 5cb01ea2-4160-4f87-afc6-5e72e6b82ad1
    objects: |
      array:
        - |
          objectName: APPLICATIONINSIGHTS-CONNECTION-STRING
          objectType: secret
  secretObjects:
