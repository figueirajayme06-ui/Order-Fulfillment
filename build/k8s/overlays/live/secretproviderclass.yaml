apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: order-fulfillment-secrets-provider
  namespace: order-fulfillment
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "4d5c109a-c9c9-4475-b5ab-4f68bc926cff"
    keyvaultName: kv-oflive
    tenantId: 5cb01ea2-4160-4f87-afc6-5e72e6b82ad1
