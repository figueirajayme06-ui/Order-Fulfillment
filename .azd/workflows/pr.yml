pool:
  name: 'Self-Hosted-Ubuntu-Shared'

trigger: none

variables:
  - template: ../actions/variables.yml

stages:
- stage: 'Build'
  displayName: 'Version, Infra Plan, Build & Test'
  variables:
  - group: OF-Dev
  
  jobs:
  - job: 'Version'
    displayName: 'Version'
    steps:
    - template: ../actions/version.yml
      parameters:
        version: $(version)

  - job: 'Infra'
    displayName: 'Infra Plan'
    dependsOn: ["Version"]
    steps:
    - template: ../actions/tf-plan.yml
      parameters:
        serviceConnection: $(serviceConnection)
        storageAccountName: $(tf-storage_account_name)
        containerName: $(tf-container_name)
        workingDirectory: '$(Build.SourcesDirectory)/build/infra'
        laws_name: $(laws_name)
        environment: $(environment)
        version: $(version)
        authClientId: $(auth_client_id)
        authScope: $(auth_scope)
        ipgSbnsConnection: $(ipg_sbns_connection)
        ipgSubName: $(ipg_sub_name)
        cr_subscription_id: $(cr_subscription_id)
        cr_name: $(cr_name)
        cr_resource_group: $(cr_resource_group)
        vnetName: 'vnet-nof-dvtst'
        vnetSubnetRoot: 'agk-nof-dev'
        enablePrivateAccess: true
        enableNewFrontend: true
        showNewFrontendForAll: false

  - job: 'Sql'
    displayName: 'Sql Build'
    dependsOn: ["Version"]
    pool:
      vmImage: 'windows-latest'
    steps:
    - template: ../actions/build-sql.yml

  - job: 'Build'
    displayName: 'Build & Test'
    dependsOn: ["Version"]
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: yourStrong(!)Password
        ports:
          - 1433
    steps:
    - template: ../actions/build.yml
      parameters:
        workingDirectory: '$(Build.SourcesDirectory)/src'
        test: true
        artifact: false
