parameters:
- name: workingDirectory
- name: test
  type: boolean
  default: true
- name: artifact
  type: boolean
  default: false

steps:
- task: UseDotNet@2
  displayName: 'dotnet install'
  inputs:
    packageType: 'sdk'
    useGlobalJson: true

- ${{ if eq(parameters['artifact'], 'true' ) }}:
  - task: PublishPipelineArtifact@1
    displayName: 'Artifact source'
    inputs:
      path: '$(Build.SourcesDirectory)/src'
      artifact: source

  - task: PublishPipelineArtifact@1
    displayName: 'Artifact k8s manifests'
    inputs:
      path: '$(Build.SourcesDirectory)/build/k8s'
      artifact: k8s

- task: DotNetCoreCLI@2
  displayName: 'dotnet restore'
  inputs:
    command: 'restore'
    projects: '${{ parameters.workingDirectory }}/**/*.csproj'
    includeNuGetOrg: true

- task: DotNetCoreCLI@2
  displayName: 'dotnet build'
  inputs:
    command: 'build'
    arguments: '--configuration Release'
    projects: '${{ parameters.workingDirectory }}/**/*.csproj'

- ${{ if eq(parameters['test'], 'true' ) }}:
  - script: |
      echo "##vso[task.setvariable variable=TEST_CONNECTION_STRING]Server=localhost,$AGENT_SERVICES_MSSQL_PORTS_1433;Database=master;User ID=sa;Password=yourStrong(!)Password;Encrypt=false;TrustServerCertificate=true;"
    displayName: 'Set SQL Server connection string'

  - task: DotNetCoreCLI@2
    displayName: 'dotnet test'
    inputs:
      command: 'test'
      arguments: '--no-build --configuration Release'
      projects: '${{ parameters.workingDirectory }}/**/*.csproj'

- ${{ if eq(parameters['artifact'], 'true' ) }}:
  - task: DotNetCoreCLI@2
    displayName: 'dotnet publish web'
    inputs:
      command: 'publish'
      publishWebProjects: False
      arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/web/publish'
      projects: '${{ parameters.workingDirectory }}/OF.UI/*.csproj'

  - task: PublishPipelineArtifact@1
    displayName: 'Publish web artifact'
    inputs:
      path: '$(Build.ArtifactStagingDirectory)/web/publish'
      artifact: web
      zipAfterPublish: True

  - task: DotNetCoreCLI@2
    displayName: 'dotnet publish web pricing'
    inputs:
      command: 'publish'
      publishWebProjects: False
      arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/web/publish/pricing'
      projects: '${{ parameters.workingDirectory }}/OF.PricingUI/*.csproj'
      zipAfterPublish: True

  - task: PublishPipelineArtifact@1
    displayName: 'Publish web pricing artifact'
    inputs:
      path: '$(Build.ArtifactStagingDirectory)/web/publish/pricing'
      artifact: pricing
      zipAfterPublish: True

  - task: DotNetCoreCLI@2
    displayName: 'dotnet publish api'
    inputs:
      command: 'publish'
      publishWebProjects: False
      arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/api/publish'
      projects: '${{ parameters.workingDirectory }}/OF.Api/*.csproj'
      zipAfterPublish: True

  - task: PublishPipelineArtifact@1
    displayName: 'Publish web artifact'
    inputs:
      path: '$(Build.ArtifactStagingDirectory)/api/publish'
      artifact: api
