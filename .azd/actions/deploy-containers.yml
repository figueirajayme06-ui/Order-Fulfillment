parameters:
- name: serviceConnection
- name: registryServiceConnection
- name: workingDirectory
- name: imageName
- name: dockerfilePath
- name: version
- name: environment
- name: aksServiceConnection
  default: ''
- name: aksRg
  default: ''
- name: aksName
  default: ''
- name: aksSub
  default: ''

steps:
- task: Docker@2
  displayName: Deploy Quotes Image
  inputs:
    command: buildAndPush
    repository: 'nof/${{ parameters.imageName }}'
    dockerfile: '${{ parameters.workingDirectory }}${{ parameters.dockerfilePath }}'
    buildContext: '${{ parameters.workingDirectory }}'
    containerRegistry: '${{ parameters.registryServiceConnection }}'
    tags: |
      ${{ parameters.version }}
      ${{ lower(parameters.environment) }}
      latest

- task: AzureCLI@2
  displayName: 'Apply K8s Manifests to AKS'
  condition: ne('${{ parameters.aksServiceConnection }}', '')
  inputs:
    azureSubscription: ${{ parameters.aksServiceConnection }}
    scriptType: bash
    scriptLocation: inlineScript
    workingDirectory: '$(Agent.BuildDirectory)/k8s'
    inlineScript: |
      ENV="${{ lower(parameters.environment) }}"
      AKS_RG="${{ parameters.aksRg }}"
      AKS_NAME="${{ parameters.aksName }}"
      AKS_SUB="${{ parameters.aksSub }}"
      KUBECONFIG_B64=$(az rest \
        --method post \
        --url "https://management.azure.com/subscriptions/${AKS_SUB}/resourceGroups/${AKS_RG}/providers/Microsoft.ContainerService/managedClusters/${AKS_NAME}/listClusterUserCredential?api-version=2023-01-01" \
        --query "kubeconfigs[0].value" -o tsv)
      mkdir -p ~/.kube
      echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
      kubelogin convert-kubeconfig -l azurecli
      kubectl apply -k overlays/$ENV
