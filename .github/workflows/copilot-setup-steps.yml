name: "Copilot Setup Steps"

# Allow testing of the setup steps from your repository's "Actions" tab.
on: workflow_dispatch

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      DOTNET_VERSION: "10.x"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v5
        with:
            dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: dotnet restore
        run: dotnet restore ./src

      - name: Start SQL Server 2019 container
        run: |
            docker pull mcr.microsoft.com/mssql/server:2019-latest
            docker run -e "ACCEPT_EULA=Y" -e "SA_PASSWORD=yourStrong!Password" -p 1433:1433 --name sqlserver -d mcr.microsoft.com/mssql/server:2019-latest
            echo "TEST_CONNECTION_STRING=Server=localhost,1433;Database=master;User ID=sa;Password=yourStrong!Password;Encrypt=false;TrustServerCertificate=true;" >> $GITHUB_ENV
            export TEST_CONNECTION_STRING='Server=localhost,1433;Database=master;User ID=sa;Password=yourStrong\!Password;Encrypt=false;TrustServerCertificate=true;'